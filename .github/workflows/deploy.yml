name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Pages serves no fallback, so a copy of index.html under 404 keeps a
      # refresh on any path working.
      - run: cp dist/index.html dist/404.html
      # No `enablement: true` here. It reads like it would save the one manual
      # step, but creating a Pages site needs repo-admin rights that the
      # workflow's GITHUB_TOKEN does not carry, so it fails the run with
      # "Resource not accessible by integration" instead. Pages has to be
      # switched on once by hand: Settings -> Pages -> Source: GitHub Actions.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
