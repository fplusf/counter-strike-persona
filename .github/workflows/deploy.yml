name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Pages serves no fallback, so a copy of index.html under 404 keeps a
      # refresh on any path working.
      - run: cp dist/index.html dist/404.html
      # No `enablement: true`. Creating a Pages site needs admin rights on the
      # repository, which a workflow's GITHUB_TOKEN never carries — public or
      # private, it answers "Resource not accessible by integration". So this
      # step only reads the existing site, and is allowed to fail so the next
      # one can replace a bare "Not Found" with the switch that fixes it.
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
      - name: Name the missing switch
        if: steps.pages.outcome == 'failure'
        run: |
          echo "::error::No Pages site is configured to build from Actions, and no workflow can create one."
          echo "::error::Set it by hand once: Settings -> Pages -> Source: GitHub Actions. Then re-run."
          exit 1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
