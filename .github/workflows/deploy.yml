name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Pages serves no fallback, so a copy of index.html under 404 keeps a
      # refresh on any path working.
      - run: cp dist/index.html dist/404.html
      # Ask for the Pages site to be created if it does not exist yet. The
      # workflow token can do this on a public repository; on a private one it
      # comes back "Resource not accessible by integration". Either way the run
      # must not die on a bare "Not Found", so the failure is caught and turned
      # into the one instruction that fixes it.
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true
      - name: Explain an unconfigurable Pages site
        if: steps.pages.outcome == 'failure'
        run: |
          echo "::error::GitHub Pages is off and this workflow's token could not switch it on."
          echo "::error::Turn it on once by hand: Settings -> Pages -> Source: GitHub Actions, then re-run this workflow."
          exit 1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
